<title>Китайский вслух</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Макет: рабочий стол Windows 95 — бирюзовый фон, серые окна с фаской, синие заголовки, панель задач с кнопкой «Пуск» */
:root {
  --desk: #008080;
  --face: #C0C0C0; --lt: #DFDFDF; --hi: #FFFFFF; --sh: #808080; --dk: #000000;
  --title1: #000080; --title2: #1084D0; --title-fg: #FFFFFF;
  --ink: #000000; --muted: #4A4A4A; --field: #FFFFFF; --sel: #000080; --sel-fg: #FFFFFF; --tip: #FFFF80;
  --ok: #008000; --bad: #C00000; --warn: #9A5600; --info: #000080;
  --ok-soft: #DDF0DD; --bad-soft: #F5D9D9; --warn-soft: #FFF2BF; --info-soft: #DCE4FF;
  --t1: #E00000; --t2: #00A000; --t3: #0000FF; --t4: #A000A0; --t0: #808080;
  --f-hanzi: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --f-ui: Tahoma, Verdana, "MS Sans Serif", "Segoe UI", Arial, sans-serif;
  --f-py: "Noto Sans", Verdana, Arial, sans-serif;
  --raised: inset -1px -1px 0 var(--dk), inset 1px 1px 0 var(--hi), inset -2px -2px 0 var(--sh), inset 2px 2px 0 var(--lt);
  --sunk: inset 1px 1px 0 var(--sh), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--dk), inset -2px -2px 0 var(--lt);
  --pressed: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--sh), inset -2px -2px 0 var(--lt);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.45 var(--f-ui); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px dotted var(--dk); outline-offset: -4px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 10px; padding-block: 12px 72px; display: grid; gap: 14px; }
.wrap > *, .card > *, .panel > *, .body > * { min-width: 0; }

/* Окно */
.win { background: var(--face); box-shadow: var(--raised); padding: 3px; }
.titlebar { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 6px; background: linear-gradient(90deg, var(--title1), var(--title2)); color: var(--title-fg); font-weight: 700; font-size: 15px; min-height: 28px; }
.titlebar .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seal { width: 18px; height: 18px; flex: none; background: var(--field); color: var(--sel); display: grid; place-items: center; font: 700 13px/1 var(--f-hanzi); box-shadow: 1px 1px 0 var(--dk); }
.tb { width: 24px; height: 22px; flex: none; border: 0; background: var(--face); box-shadow: var(--raised); color: var(--dk); font: 700 13px/1 var(--f-ui); display: grid; place-items: center; padding: 0 0 2px; }
.tb.x { font-size: 15px; }
.tb:active { box-shadow: var(--pressed); }
.tb svg { width: 14px; height: 14px; }
.menubar { display: flex; flex-wrap: wrap; padding: 1px 2px; border-bottom: 1px solid var(--sh); box-shadow: 0 1px 0 var(--hi); }
.menubar button { border: 0; background: none; padding: 5px 9px; font-size: 14px; min-height: 32px; }
.menubar button u { text-decoration: underline; }
.menubar button:active, .menubar button[aria-current="true"] { background: var(--sel); color: var(--sel-fg); }
.body { padding: 8px 8px 10px; display: grid; gap: 12px; }

/* Общие элементы */
h2 { margin: 0; font-size: 14px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn { min-height: 38px; padding: 6px 16px; border: 0; background: var(--face); box-shadow: var(--raised); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn:active { box-shadow: var(--pressed); padding: 7px 15px 5px 17px; }
.btn.primary { font-weight: 700; outline: 1px solid var(--dk); outline-offset: 0; }
.btn.big { min-height: 46px; font-size: 16px; width: 100%; }
.btn.quiet { box-shadow: none; background: none; text-decoration: underline; color: var(--sel); }
.btn.quiet:active { padding: 6px 16px; }
.btn svg { width: 17px; height: 17px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.panel { position: relative; border: 2px groove var(--hi); padding: 16px 10px 10px; margin-top: 6px; display: grid; gap: 10px; }
.panel > h2:first-child { position: absolute; top: -9px; left: 8px; background: var(--face); padding: 0 4px; font-size: 13px; font-weight: 700; }

/* Главная */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { background: var(--field); box-shadow: var(--sunk); padding: 8px 10px; display: grid; gap: 0; }
.stat b { font-size: 24px; line-height: 1.1; color: var(--sel); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 34px; padding: 4px 10px 4px 7px; border: 0; background: var(--face); box-shadow: var(--raised); font-size: 13px; display: inline-flex; gap: 7px; align-items: center; }
.chip:active { box-shadow: var(--pressed); }
.chip .cb { width: 13px; height: 13px; flex: none; background: var(--field); box-shadow: var(--sunk); display: grid; place-items: center; font: 700 11px/1 var(--f-ui); color: var(--dk); }
.chip[aria-pressed="true"] .cb::before { content: "✓"; }
.chip em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.chip[aria-pressed="true"] em { color: var(--sel); }
.checks { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13px; align-items: start; }
.dot { width: 11px; height: 11px; margin: 4px 0 0 3px; background: var(--sh); box-shadow: inset 1px 1px 0 rgba(255,255,255,.55), 1px 1px 0 var(--dk); }
.dot.ok { background: #00C000; } .dot.bad { background: #E00000; } .dot.warn { background: #FFD000; }
.howto { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.note { background: var(--tip); border: 1px solid var(--dk); padding: 8px 10px; font-size: 13px; }
.note a { color: var(--sel); font-weight: 700; }

/* Карточка */
.bar { height: 20px; background: var(--field); box-shadow: var(--sunk); padding: 3px; }
.bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--sel) 0 9px, transparent 9px 11px); transition: width .3s; }
.count { font-variant-numeric: tabular-nums; font-size: 13px; }
.cardtop { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.card { display: grid; gap: 14px; text-align: center; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.badge { padding: 2px 8px; background: var(--sel); color: var(--sel-fg); font-weight: 700; font-size: 12px; }
.badge.new { background: var(--tip); color: var(--dk); border: 1px solid var(--dk); }
.word { border: 0; background: var(--field); box-shadow: var(--sunk); padding: 14px 10px; width: 100%; display: grid; gap: 4px; justify-items: center; }
.hz { font-family: var(--f-hanzi); font-weight: 700; font-size: clamp(64px, 21vw, 112px); line-height: 1.08; letter-spacing: .03em; }
.hz.hidden { color: var(--sh); font-size: 48px; letter-spacing: .3em; }
.py { font-family: var(--f-py); font-size: clamp(22px, 6.4vw, 30px); font-weight: 500; letter-spacing: .01em; }
.s1 { color: var(--t1); } .s2 { color: var(--t2); } .s3 { color: var(--t3); } .s4 { color: var(--t4); } .s0 { color: var(--t0); }
.meaning { font-size: 24px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.mean { width: 100%; margin-top: 6px; padding-top: 8px; border-top: 1px dotted var(--sh); font-size: 24px; font-weight: 700; line-height: 1.25; color: var(--ink); text-wrap: balance; }
.mean small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.mean.hid { font-size: 14px; font-weight: 400; font-style: italic; color: var(--sh); }
.meaning small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 3px; display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; background: var(--field); box-shadow: var(--sunk); }
.steps li { font-size: 13px; padding: 3px 10px; color: var(--muted); }
.steps li.on { background: var(--sel); color: var(--sel-fg); }
.steps li.done { color: var(--ok); }
.steps li.done::before { content: "✓ "; }
.prompt { font-size: 17px; font-weight: 700; }
.mic { width: 92px; height: 92px; border: 0; background: var(--face); box-shadow: var(--raised); color: var(--dk); display: grid; place-items: center; margin: 0 auto; position: relative; }
.mic svg { width: 40px; height: 40px; }
.mic .ml { position: absolute; left: 0; right: 0; bottom: 5px; font: 700 12px/1 var(--f-ui); letter-spacing: .03em; }
.mic.ru .ml { color: var(--sel); } .mic.zh .ml { color: #C00000; }
.mic.ru svg, .mic.zh svg { margin-bottom: 12px; }
.mic:active, .mic.live { box-shadow: var(--pressed); }
.mic.live { color: #C00000; }
.mic.live::after { content: ""; position: absolute; top: 8px; right: 8px; width: 11px; height: 11px; border-radius: 50%; background: #FF0000; box-shadow: 0 0 5px #FF0000; animation: blink 1s steps(2, start) infinite; }
.mic:disabled { opacity: .45; cursor: default; }
/* Микрофон по центру, справа — «Пропустить: знаю слово» */
.microw { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.microw .mic { margin: 0; grid-column: 2; }
.microw .know { grid-column: 3; justify-self: center; }
.btn.know { display: inline-grid; justify-items: center; gap: 1px; line-height: 1.15; }
.btn.know small { font-size: 10px; color: var(--muted); }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .mic.live::after { animation: none; } .bar i { transition: none; } }
.live { min-height: 22px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.typed { display: flex; gap: 6px; }
.typed input { flex: 1; width: 0; min-width: 0; min-height: 40px; padding: 6px 8px; border: 0; background: var(--field); box-shadow: var(--sunk); font-size: 16px; }
.fb { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 10px; text-align: left; background: var(--face); box-shadow: var(--raised); font-size: 14px; overflow-wrap: anywhere; }
.fb .ico { width: 32px; height: 32px; }
.fb .ico svg { width: 32px; height: 32px; display: block; }
.fb .txt { display: grid; gap: 4px; }
.fb.ok { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); } .fb.warn { background: var(--warn-soft); } .fb.info { background: var(--info-soft); }
.fb b.tag { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.fb.ok b.tag { color: var(--ok); } .fb.bad b.tag { color: var(--bad); } .fb.warn b.tag { color: var(--warn); } .fb.info b.tag { color: var(--info); }
.fb .zh { font-family: var(--f-hanzi); font-weight: 700; }
.fb .pyi { font-family: var(--f-py); }

/* Итоги и словарь */
.score { font-size: 44px; font-weight: 700; color: var(--sel); font-variant-numeric: tabular-nums; line-height: 1; }
.list { display: grid; background: var(--field); box-shadow: var(--sunk); padding: 3px; }
.li { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border: 0; border-bottom: 1px dotted var(--sh); background: none; text-align: left; width: 100%; }
.li:last-child { border-bottom: 0; }
.li:active { background: var(--sel); color: var(--sel-fg); }
.li .h { font-family: var(--f-hanzi); font-weight: 700; font-size: 26px; line-height: 1.1; }
.li .p { font-family: var(--f-py); font-size: 15px; }
.li .r { font-size: 13px; color: var(--muted); }
.li:active .r { color: var(--sel-fg); }
.res { font-size: 12px; padding: 2px 7px; white-space: nowrap; font-weight: 700; }
.res.ok { background: var(--ok-soft); color: var(--ok); } .res.bad { background: var(--bad-soft); color: var(--bad); }
.boxes { display: flex; gap: 3px; }
.boxes i { width: 8px; height: 8px; background: var(--face); box-shadow: inset 1px 1px 0 var(--sh); }
.boxes i.on { background: var(--sel); box-shadow: none; }
.group h2 { margin: 10px 0 4px; }

/* Настройки */
.field { display: grid; gap: 6px; }
.field label, .lab { font-weight: 700; font-size: 13px; }
.field select, .field input[type="range"] { min-height: 40px; width: 100%; }
.field select { padding: 6px 8px; border: 0; background: var(--field); box-shadow: var(--sunk); }
input[type="range"] { accent-color: var(--sel); }
.tog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 14px; min-height: 36px; }
.tog input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin: 0; background: var(--field); box-shadow: var(--sunk); display: grid; place-items: center; }
.tog input:checked::before { content: "✓"; font: 700 14px/1 var(--f-ui); color: var(--dk); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 5px 12px; border: 0; background: var(--face); box-shadow: var(--raised); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--lt); box-shadow: var(--pressed); font-weight: 700; }
.ta { width: 100%; min-height: 72px; padding: 8px 10px; border: 0; background: var(--field); box-shadow: var(--sunk); font: 13px/1.4 var(--f-ui); resize: vertical; }

/* Панель задач и меню «Пуск» */
.taskbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--face); border-top: 1px solid var(--hi); box-shadow: 0 -1px 0 var(--sh); display: flex; gap: 5px; align-items: center; padding: 4px 5px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
.start { height: 30px; border: 0; background: var(--face); box-shadow: var(--raised); font-weight: 700; font-size: 14px; padding: 0 9px 0 6px; display: flex; gap: 6px; align-items: center; flex: none; }
.start:active, .start[aria-expanded="true"] { box-shadow: var(--pressed); }
.flag { width: 16px; height: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; transform: skewX(-8deg); }
.flag i { display: block; }
.flag i:nth-child(1) { background: #FF0000; } .flag i:nth-child(2) { background: #00C000; } .flag i:nth-child(3) { background: #0000FF; } .flag i:nth-child(4) { background: #FFD000; }
.task { flex: 1; min-width: 0; height: 30px; box-shadow: var(--pressed); background: var(--lt); padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.clock { height: 30px; flex: none; box-shadow: var(--sunk); background: var(--face); padding: 0 8px; display: flex; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scrim { position: fixed; inset: 0; z-index: 25; background: transparent; border: 0; padding: 0; }
.startmenu { position: fixed; left: 5px; bottom: calc(42px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--face); box-shadow: var(--raised), 2px 2px 0 rgba(0,0,0,.4); display: grid; grid-template-columns: 26px minmax(0, 1fr); min-width: 230px; max-width: calc(100vw - 10px); padding: 3px; }
.band { background: linear-gradient(180deg, var(--title2), var(--title1)); color: var(--face); writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; font-size: 15px; padding: 8px 3px; letter-spacing: .06em; white-space: nowrap; }
.band b { color: var(--hi); }
.startmenu ul { list-style: none; margin: 0; padding: 2px 0; }
.startmenu li button { width: 100%; text-align: left; border: 0; background: none; padding: 7px 14px 7px 10px; font-size: 15px; display: flex; gap: 10px; align-items: center; min-height: 42px; }
.startmenu li button:active { background: var(--sel); color: var(--sel-fg); }
.startmenu li button svg { width: 24px; height: 24px; flex: none; }
.startmenu hr { border: 0; border-top: 1px solid var(--sh); border-bottom: 1px solid var(--hi); margin: 3px 2px; }
</style>
<style>
/* Одно окно в пределах видимой области, включая адресную строку и клавиатуру. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { padding: 0; }
#app { height: var(--app-height, 100dvh); min-height: 0; }
#app .wrap { height: calc(100% - 42px - env(safe-area-inset-bottom, 0px)); padding: max(4px, env(safe-area-inset-top, 0px)) 5px 5px; gap: 0; }
.wrap > .win { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.win > .titlebar, .win > .menubar { flex: none; }
.win > .body { position: relative; isolation: isolate; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden; }
.body > * { flex: none; }
.page-content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.page-content > * { flex: none; }
.page-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: none; min-height: 38px; }
.page-nav .btn { min-height: 38px; padding-inline: 12px; }
.page-nav span { font-size: 12px; text-align: center; }
.page-nav button:disabled { opacity: .5; cursor: default; }
.home-start { flex: none; }
.page-content p { margin-block: 0; }
.cardtop { flex: none; }
.card { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px; }
.card > * { flex: none; }
.card .word { flex: 1; min-height: 90px; padding: 8px; align-content: center; }
.card .hz { font-size: clamp(38px, 13vw, 82px); }
.card .hz.hidden { font-size: 34px; }
.card .py { font-size: clamp(18px, 5vw, 26px); }
.card .mean { font-size: 20px; margin-top: 3px; padding-top: 3px; }
.card .mean small, .card .meaning small { font-size: 11px; }
.card .mean.hid { font-size: 12px; }
.answer-area { display: grid; gap: 6px; }
.card .prompt { font-size: 14px; }
.card .mic { width: 64px; height: 64px; }
.card .mic svg { width: 29px; height: 29px; }
.card .live { font-size: 12px; min-height: 18px; }
.card .btn { min-height: 36px; padding: 5px 11px; font-size: 13px; }
.card .row { gap: 5px; }
.card .steps li { font-size: 11px; padding: 2px 6px; }
.card .fb { padding: 6px; gap: 6px; font-size: 12px; grid-template-columns: 24px minmax(0, 1fr); }
.card .fb .ico, .card .fb .ico svg { width: 24px; height: 24px; }
.card .fb b.tag { font-size: 11px; }
.card .fb .txt { gap: 2px; }
.puzzle-backdrop { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.puzzle-art, .puzzle-art img, .puzzle-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.puzzle-art img { object-fit: cover; }
.puzzle-piece { opacity: 1; transition: opacity .55s ease; }
.puzzle-piece path { fill: #c0c0c0; stroke: #999; stroke-width: 1.5; }
.puzzle-piece text { fill: #777; font-family: var(--f-ui); font-weight: 700; }
.puzzle-piece.is-open { opacity: 0; }
.puzzle-body .word { background: transparent; box-shadow: none; }
.puzzle-body .hz, .puzzle-body .py { text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; }
.puzzle-body .mean, .puzzle-body .meta, .puzzle-body .prompt, .puzzle-body .live { background: rgba(255,255,255,.86); padding: 2px 5px; border-radius: 2px; }
.puzzle-body .word .mean { width: auto; border: 0; }
.puzzle-status { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; flex: none; }
.puzzle-status span { background: rgba(255,255,255,.9); padding: 2px 5px; }
.puzzle-status .btn { min-height: 30px; font-size: 12px; padding: 3px 9px; }
.puzzle-viewing .puzzle-body > :not(.puzzle-backdrop):not(.puzzle-status) { display: none; }

.keyboard-open .card .word { min-height: 40px; grid-template-columns: 1fr 1fr; gap: 1px; }
.keyboard-open .card .hz { font-size: 28px; }

function fitCard() {
  const card = document.querySelector('.card');
  if (!card || PUZZLE.viewing) return;
  card.classList.remove('card-compact', 'card-tight');
  if (card.scrollHeight > card.clientHeight + 1) card.classList.add('card-compact');
  if (card.scrollHeight > card.clientHeight + 1) card.classList.add('card-tight');
}
// Длинные разделы разбиваются по фактической высоте, без вертикального скролла.
function paginateScreen() {
  if (S.screen === 'card' || PUZZLE.viewing) return;
  const body = document.querySelector('.wrap > .win > .body');
  if (!body) return;
  const blocks = [...body.children].filter(el => !el.matches('.puzzle-backdrop, .puzzle-status, .home-start'));
  const launch = body.querySelector('.home-start');
  const content = document.createElement('div'); content.className = 'page-content';
  const nav = document.createElement('div'); nav.className = 'page-nav';
  nav.innerHTML = '<button class="btn" data-act="page" data-val="-1">← Назад</button><span aria-live="polite"></span><button class="btn" data-act="page" data-val="1">Далее →</button>';
  blocks.forEach(el => el.remove());
  if (launch) launch.remove();
  body.append(content, nav);
  if (launch) body.append(launch);
  const capacity = content.clientHeight;
  if (!capacity) return;
  const pages = []; let page = [];
  // Разделяем только слишком большие блоки; заголовок повторяется на каждой части.
  function split(el) {
    if (el.matches('.list, .checks, .howto, .chips') && el.children.length > 1) {
      return [...el.children].map(item => { const shell = el.cloneNode(false); shell.append(item); return shell; });
    }
    if (el.matches('.panel, .group') && [...el.children].filter(item => !item.matches('h2, .lab')).length > 1) {
      const heading = el.querySelector('h2');
      const children = [...el.children].filter(item => item !== heading);
      const chunks = []; let label = null;
      children.forEach(item => {
        if (item.matches('.lab')) { label = item; return; }
        const shell = el.cloneNode(false);
        if (heading) shell.append(heading.cloneNode(true));
        if (label) { shell.append(label); label = null; }
        shell.append(item); chunks.push(shell);
      });
      return chunks.length > 1 ? chunks : null;
    }
    if (el.matches('.panel, .group')) {
      const list = el.querySelector('.list, .checks, .howto, .chips');
      if (list && list.children.length > 1) {
        return [...list.children].map(item => {
          const shell = el.cloneNode(false), heading = el.querySelector('h2');
          if (heading) shell.append(heading.cloneNode(true));
          const partial = list.cloneNode(false); partial.append(item); shell.append(partial); return shell;
        });
      }
    }
    return null;
  }
  const queue = blocks.slice();
  while (queue.length) {
    const el = queue.shift(); content.append(el);
    if (content.scrollHeight > capacity + 1) {
      el.remove();
      if (page.length) { pages.push(page); page = []; content.replaceChildren(); queue.unshift(el); continue; }
      const parts = split(el);
      if (parts) { queue.unshift(...parts); continue; }
      content.append(el);
    }
    page.push(el);
  }
  if (page.length) pages.push(page);
  const index = Math.max(0, Math.min(UI_PAGES[S.screen] || 0, pages.length - 1));
  UI_PAGES[S.screen] = index;
  content.replaceChildren(...(pages[index] || []));
  if (pages.length < 2) nav.remove();
  else {
    nav.querySelector('span').textContent = (index + 1) + ' / ' + pages.length;
    nav.querySelector('[data-val="-1"]').disabled = index === 0;
    nav.querySelector('[data-val="1"]').disabled = index === pages.length - 1;
  }
}

function viewCard() {

    + '<span class="count">' + pct + '%</span></div>'
    + '<section class="card">'
    + '<div class="meta"><span class="badge' + (isIntro ? ' new' : '') + '">' + (isIntro ? 'Новое слово' : item.mode === 'recall' ? 'Вспомните' : isRu ? 'По-китайски' : 'Повторение') + '</span><span>' + esc(THEME_NAME[w.t]) + '</span></div>'
    + '<button class="word" style="--hz-count:' + w.h.length + '" data-act="play" aria-label="Прослушать слово">'
    + (showHz ? '<span class="hz" lang="zh-CN">' + esc(w.h) + '</span>' : '<span class="hz hidden">· · ·</span>')
    + (showPy ? '<span class="py">' + pinyinHtml(w.s) + '</span>' : '')
    + (showMean
      ? '<span class="mean">' + esc(w.r[0]) + (w.n && !saying ? '<small>' + esc(w.n) + '</small>' : '') + '</span>'
      : '<span class="mean hid">перевод — после вашего ответа</span>')
    + '</button>'
    + (saying
      ? (ruVoice() ? '<div class="row"><button class="btn" data-act="play">' + ICON.play + ' Повторить задание</button></div>' : '')
      : '<div class="row"><button class="btn" data-act="play">' + ICON.play + ' Ещё раз</button><button class="btn" data-act="slow">Медленно</button></div>')
    + '<ol class="steps">' + stepsHtml + '</ol>'
    + '<div class="answer-area">' + area + '</div>'
    + '</section>', { close: 'quit', closeLabel: 'Закончить раунд', puzzle: true });
}

function viewSummary() {
  const R = S.round;
  const ids = R.order;
  const ok = ids.filter(id => R.first[id]).length;
  const rows = ids.map(id => {
    const w = BY_ID[id];
    return '<button class="li" data-act="say" data-id="' + esc(id) + '"><span class="h" lang="zh-CN">' + esc(w.h) + '</span><span><span class="p">' + pinyinHtml(w.s) + '</span><br><span class="r">' + esc(w.r[0]) + '</span></span>'
      + (R.known && R.known[id] ? '<span class="res ok">знаю</span>' : R.first[id] ? '<span class="res ok">верно</span>' : R.final[id] ? '<span class="res ok">со 2-й попытки</span>' : '<span class="res bad">повторить</span>') + '</button>';
  }).join('');
  return win('Раунд завершён', '<section class="panel" style="text-align:center"><h2>Результат</h2><div class="score">' + ok + ' из ' + ids.length + '</div><div class="muted small">' + plural(ok, 'слово', 'слова', 'слов') + ' с первого раза · прогресс сохранён</div></section>'
    + '<section class="list" aria-label="Слова раунда">' + rows + '</section>'
    + '<div class="row"><button class="btn primary big" data-act="start">' + ICON.play + ' Ещё раунд</button><button class="btn" data-act="home">На главную</button></div>', { close: 'home', puzzle: true });
}

function viewDict() {
  const groups = THEMES.map(t => {
    const rows = WORDS.filter(w => w.t === t.id).map(w => {
      const b = P(w.id) ? P(w.id).box : 0;
      return '<button class="li" data-act="say" data-id="' + esc(w.id) + '"><span class="h" lang="zh-CN">' + esc(w.h) + '</span><span><span class="p">' + pinyinHtml(w.s) + '</span><br><span class="r">' + esc(w.r.filter(x => !/^\d+$/.test(x)).slice(0, 3).join(', ')) + '</span></span>'
        + '<span class="boxes" aria-label="Уровень ' + b + ' из 5">' + [1, 2, 3, 4, 5].map(k => '<i class="' + (k <= b ? 'on' : '') + '"></i>').join('') + '</span></button>';
    }).join('');
    return '<section class="group"><h2>' + esc(t.name) + '</h2><div class="list">' + rows + '</div></section>';
  }).join('');
  return win('Словарь', '<p class="muted small" style="margin:0">Нажмите на слово, чтобы послушать. Квадраты справа — уровень от 0 до 5.</p>' + groups, { close: 'home' });
}

function viewSettings() {
  const s = S.set;
  const seg = (key, vals, fmt) => '<div class="seg">' + vals.map(v => '<button data-act="set" data-key="' + key + '" data-val="' + v + '" aria-pressed="' + (String(s[key]) === String(v)) + '">' + (fmt ? fmt(v) : v) + '</button>').join('') + '</div>';
  const tog = (key, label) => '<label class="tog"><span>' + label + '</span><input type="checkbox" data-tog="' + key + '"' + (s[key] ? ' checked' : '') + '></label>';
  const vs = zhVoices();
  const autoV = (() => { const keep = s.voiceURI; s.voiceURI = ''; const a = pickVoice(); s.voiceURI = keep; return a; })();
  const voiceSel = vs.length
    ? '<div class="field"><label for="voice">Голос</label><select id="voice" data-sel="voiceURI"><option value="">Автовыбор' + (autoV ? ' (' + esc(autoV.name) + ')' : '') + '</option>' + vs.map(v => '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === s.voiceURI ? ' selected' : '') + '>' + esc(v.name) + (NOVELTY_VOICE.test(v.name) ? ' — искажённый' : '') + '</option>').join('') + '</select></div>'
      + (s.voiceURI && NOVELTY_VOICE.test((vs.find(v => v.voiceURI === s.voiceURI) || {}).name || '') ? '<p class="note">Выбран искажённый синтетический голос: китайский звучит неестественно. Выберите «Автовыбор».</p>' : '')
    : '<p class="muted small" style="margin:0">Китайские голоса в системе не найдены. На iPhone: Настройки → Универсальный доступ → Устный контент → Голоса → Китайский (материковый).</p>';
  const ttsNote = S.ttsLog && S.ttsTest ? '<p class="note">Проверка звука: ' + esc(S.ttsLog.state) + ', голос ' + esc(S.ttsLog.voice) + (S.ttsError && TTS_TEXT[S.ttsError] ? '. ' + esc(TTS_TEXT[S.ttsError]) : '') + '</p>' : '';
  return win('Настройки', ''
    + '<section class="panel"><h2>Раунд</h2><span class="lab">Слов за раунд</span>' + seg('roundSize', [6, 10, 15, 20])
    + '<span class="lab">Из них новых</span>' + seg('newPerRound', [2, 4, 6, 8]) + '</section>'
    + '<section class="panel"><h2>Направление</h2>' + seg('direction', ['zh', 'mix', 'ru'], v => v === 'mix' ? 'Смешанно' : v === 'zh' ? 'Слушать и повторять' : 'Говорить по-китайски')
    + '<p class="muted small" style="margin:0">«Слушать и повторять»: программа всегда произносит слово по-китайски, вы повторяете. «Смешанно»: выученные слова (уровень 3+) идут наоборот — программа говорит перевод по-русски, а вы вспоминаете и говорите слово по-китайски. «Говорить по-китайски»: так все слова.</p></section>'
    + '<section class="panel"><h2>Ответы</h2>' + seg('input', ['voice', 'text'], v => v === 'voice' ? 'Голосом' : 'С клавиатуры')
    + tog('autoMic', 'Микрофон включается сам после слова') + tog('autoNext', 'Переходить дальше после верного ответа') + tog('beep', 'Короткий сигнал, когда микрофон включился') + '</section>'
    + '<section class="panel"><h2>Перевод на карточке</h2>' + seg('meaning', ['always', 'after'], v => v === 'after' ? 'После ответа' : 'Сразу')
    + '<p class="muted small" style="margin:0">«Сразу»: перевод виден всегда; вы слушаете и повторяете слово, отдельно называть перевод не нужно. «После ответа»: на повторении перевод скрыт, и после повтора программа просит сказать его по-русски — так слова запоминаются прочнее, но шаг сложнее. У новых слов перевод виден сразу в обоих режимах.</p></section>'
    + '<section class="panel"><h2>Показ</h2>' + tog('showHanzi', 'Показывать иероглифы') + tog('showPinyin', 'Показывать пиньинь')
    + '<p class="muted small" style="margin:0">Без иероглифов и пиньиня — тренировка только на слух.</p></section>'
    + '<section class="panel"><h2>Голос</h2><div class="field"><label for="rate">Скорость речи: <span id="rateval">' + s.rate.toFixed(2) + '</span></label><input id="rate" type="range" min="0.5" max="1.1" step="0.05" value="' + s.rate + '" data-range="rate"></div>'
    + voiceSel + '<div class="row" style="justify-content:flex-start"><button class="btn" data-act="ttstest">' + ICON.play + ' Проверить звук</button></div>' + ttsNote + '</section>'
    + '<section class="panel"><h2>Резервная копия</h2><p class="muted small" style="margin:0">Прогресс хранится в этом браузере. Safari может стереть данные сайта, если неделю им не пользоваться. Скопируйте прогресс в Заметки; чтобы вернуть его или перенести на другое устройство, вставьте текст в поле и нажмите «Восстановить».</p>'
    + '<textarea id="backup" class="ta" rows="3" placeholder="Сюда вставьте сохранённый текст">' + esc(S.backupText) + '</textarea>'
    + '<div class="row" style="justify-content:flex-start"><button class="btn" data-act="backup">Скопировать прогресс</button><button class="btn" data-act="restore">Восстановить</button></div>'
    + (S.note ? '<p class="note">' + esc(S.note) + '</p>' : '') + '</section>'
    + '<section class="panel"><h2>Сброс</h2>'
    + '<div class="row" style="justify-content:flex-start"><button class="btn" data-act="reset">' + (S.resetArm ? 'Нажмите ещё раз, чтобы стереть' : 'Сбросить прогресс') + '</button></div></section>'
    + '<div class="row"><button class="btn primary" data-act="home" style="min-width:120px">OK</button></div>', { close: 'home' });
}

/* ---------- События ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act0 = b.dataset.act;
  const act = act0 === 'menu-home' ? 'home' : act0 === 'menu-start' ? 'start' : act0;
  const c = S.card;
  if (act !== 'reset') S.resetArm = false;
  if (act !== 'backup' && act !== 'restore') S.note = '';
  if (act !== 'startmenu') S.startOpen = false;
  if (S.set.beep) ensureAudio();
  switch (act) {
    case 'page': UI_PAGES[S.screen] = Math.max(0, (UI_PAGES[S.screen] || 0) + Number(b.dataset.val)); render(); break;
    case 'feedback': clearTimers(); abortListening(); S.screen = 'feedback'; render(); break;
    case 'feedback-back': S.screen = 'card'; render(); break;
    case 'puzzle-view': puzzleView(); break;
    case 'startmenu': S.startOpen = !S.startOpen; render(); break;
    case 'closemenu': render(); break;
    case 'start': leaveCard(); startRound(); if (S.screen !== 'card') render(); break;
    case 'hard': leaveCard(); startRound(hardWords().map(w => w.id)); if (S.screen !== 'card') render(); break;
    case 'home': leaveCard(); S.screen = 'home'; render(); break;
    case 'quit':
      leaveCard();
      S.screen = S.round && S.round.order.length ? 'summary' : 'home'; render(); break;
    case 'settings': leaveCard(); S.screen = 'settings'; render(); break;
    case 'dict': leaveCard(); S.screen = 'dict'; render(); break;
    case 'help': leaveCard(); S.screen = 'help'; render(); break;
    case 'theme': {
      const id = b.dataset.id, t = S.set.themes;
      S.set.themes = t.includes(id) ? (t.length > 1 ? t.filter(x => x !== id) : t) : [...t, id];
      save(KEY_SET, S.set); render(); break;
    }
    case 'play': if (c) playThenListen(false); break;
    case 'slow': if (c) playThenListen(true); break;
    case 'say': speak(BY_ID[b.dataset.id].h); break;
    case 'mic':
      if (S.listening) { if (rec) try { rec.stop(); } catch (er) { /* уже остановлено */ } }
      else startListening(true);
      break;
    case 'retry': if (c) { c.fb = null; playThenListen(true); } break;
    case 'acceptpron': acceptPron(); break;
    case 'skippron': skipPron(); break;
    case 'know': knowWord(); break;
    case 'unknow': unknowWord(); break;
    case 'introdone': finishIntro(); break;
    case 'dontknow': abortListening(); onTranslate({ level: 'dontknow' }); break;
    case 'peek': peek(); break;
    case 'reveal': if (c && c.phase === 'say') { clearTimers(); abortListening(); revealSay(); } break;
    case 'backup': {
      const data = JSON.stringify({ v: 1, at: new Date().toISOString(), prog: S.prog, stats: ST, set: S.set });
      S.backupText = data;
      const done = () => { S.note = 'Скопировано в буфер обмена. Вставьте текст в Заметки.'; render(); };
      const manual = () => { S.note = 'Буфер обмена недоступен: выделите текст в поле и скопируйте вручную.'; render(); };
      try { navigator.clipboard.writeText(data).then(done, manual); } catch (er) { manual(); }
      break;
    }
    case 'restore': {
      try {
        const d = JSON.parse(S.backupText);
        if (!d || typeof d.prog !== 'object' || Array.isArray(d.prog)) throw new Error('bad');
        S.prog = d.prog;
        if (d.stats && typeof d.stats === 'object') { ST = d.stats; ST.days = ST.days || {}; ST.tones = ST.tones || {}; ST.pairs = ST.pairs || {}; }
        if (d.set && typeof d.set === 'object') { S.set = Object.assign(DEFAULTS(), d.set); S.set.themes = (S.set.themes || []).filter(id => THEME_NAME[id]); if (!S.set.themes.length) S.set.themes = THEMES.map(t => t.id); }
        save(KEY_PROG, S.prog); save(KEY_STATS, ST); save(KEY_SET, S.set);
        S.note = 'Восстановлено: ' + Object.keys(S.prog).length + ' ' + plural(Object.keys(S.prog).length, 'слово', 'слова', 'слов') + ' с прогрессом.';
      } catch (er) { S.note = 'Не удалось прочитать: вставьте в поле весь текст резервной копии.'; }
      render();
      break;
    }
    case 'override': overrideTranslation(); break;
    case 'next': next(); break;
    case 'set': {
      const k = b.dataset.key, v = b.dataset.val;
      S.set[k] = /^\d+$/.test(v) ? +v : v;
      if (k === 'input' && v === 'voice') S.micBlocked = false;
      save(KEY_SET, S.set); render(); break;
    }
    case 'ttstest': S.ttsTest = true; speak('你好，我们开始学习中文吧').then(() => { if (S.screen === 'home' || S.screen === 'settings') render(); }); break;
    case 'mictest':
      S.micTest = { ok: true, text: 'Скажите по-русски «привет»…' }; render();
      listen('ru-RU').then(r => {
        if (r.alts.length) S.micTest = { ok: true, text: 'Микрофон работает. Распознано: «' + r.alts[0] + '»' };
        else {
          if (r.error === 'not-allowed' || r.error === 'service-not-allowed') S.micBlocked = true;
          S.micTest = { ok: false, text: ((r.error === 'not-allowed' || r.error === 'service-not-allowed') ? 'Доступ к микрофону запрещён. Разрешите его для этой страницы в настройках браузера.' : (ERR_TEXT[r.error] || 'Ничего не распознано, попробуйте ещё раз.')) + ' Код: ' + (r.error || 'нет') + '. Журнал: ' + (r.trace || []).join(' → ') };
        }
        if (S.screen === 'home') render();
      });
      break;
    case 'reset':
      if (S.resetArm) { S.prog = {}; ST = { days: {}, tones: {}, pairs: {} }; save(KEY_PROG, S.prog); save(KEY_STATS, ST); S.resetArm = false; }
      else S.resetArm = true;
      render(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.tog) { S.set[t.dataset.tog] = t.checked; save(KEY_SET, S.set); }
  if (t.dataset.sel) { S.set[t.dataset.sel] = t.value; save(KEY_SET, S.set); }
  if (t.dataset.range) { S.set[t.dataset.range] = +t.value; save(KEY_SET, S.set); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.range === 'rate') { const el = document.getElementById('rateval'); if (el) el.textContent = (+t.value).toFixed(2); }
  if (t.id === 'backup') S.backupText = t.value;
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="typed"]');
  if (!f) return;
  e.preventDefault();
  const v = f.querySelector('input').value;
  if (v.trim()) submitTyped(v);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && PUZZLE.viewing) { puzzleView(); return; }
  if (PUZZLE.viewing) return;
  if (e.key === 'Escape' && S.startOpen) { S.startOpen = false; render(); return; }
  if (S.screen !== 'card' || !S.card) return;
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === ' ' || e.key === 'Enter') {
    const c = S.card;
    e.preventDefault();
    if (c.phase === 'reveal') finishIntro();
    else if (c.phase === 'result') next();
    else if (useVoice()) { if (S.listening) { if (rec) try { rec.stop(); } catch (er) { /* уже остановлено */ } } else startListening(true); }
  } else if (e.key === 'r' || e.key === 'к') playThenListen(false);
});

// Доступ для автотестов
window.__kv = { WORDS, checkPron, checkTyped, checkTranslation, pinyinPlain, numZh, cleanZh, describeSyl, hardWords, streak, palladius, soundsLikeChinese, S, get ST() { return ST; } };

render();
if (window.speechSynthesis) setTimeout(() => { if (S.screen === 'home') render(); }, 700);
})();
</script>
